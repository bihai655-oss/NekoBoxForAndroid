name: TV APK Build
on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: write

env:
  # signing of the generated TV keystore (kept in the Actions cache, not a real secret)
  KEYSTORE_PASS: tv-release
  ALIAS_NAME: tv
  ALIAS_PASS: tv-release
  # rolling release tag the APKs are published to
  RELEASE_TAG: tv-latest

jobs:
  libcore:
    name: Native Build (LibCore)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Golang Status
        run: find buildScript libcore/*.sh | xargs cat | sha1sum > golang_status
      - name: Libcore Status
        run: git ls-files libcore | xargs cat | sha1sum > libcore_status
      - name: LibCore Cache
        id: cache
        uses: actions/cache@v4
        with:
          path: app/libs/libcore.aar
          key: libcore-${{ hashFiles('.github/workflows/*', 'golang_status', 'libcore_status') }}
      - name: Install Golang
        if: steps.cache.outputs.cache-hit != 'true'
        uses: actions/setup-go@v5
        with:
          go-version: ^1.25
      - name: Native Build
        if: steps.cache.outputs.cache-hit != 'true'
        run: ./run lib core
      - name: Upload libcore.aar
        uses: actions/upload-artifact@v4
        with:
          name: libcore
          path: app/libs
          retention-days: 7
  build:
    name: Build TV APK
    runs-on: ubuntu-latest
    needs:
      - libcore
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Download libcore.aar
        uses: actions/download-artifact@v4
        with:
          name: libcore
          path: app/libs
      - name: Gradle cache
        uses: actions/cache@v4
        with:
          path: ~/.gradle
          key: gradle-oss-${{ hashFiles('**/*.gradle.kts') }}
      - name: Restore signing keystore
        id: keystore
        uses: actions/cache@v4
        with:
          path: .tv-keystore
          key: tv-keystore-v1
      - name: Prepare signing keystore
        run: |
          if [ ! -f .tv-keystore ]; then
            keytool -genkeypair -v -keystore .tv-keystore -alias "$ALIAS_NAME" \
              -keyalg RSA -keysize 2048 -validity 10950 \
              -storepass "$KEYSTORE_PASS" -keypass "$ALIAS_PASS" \
              -dname "CN=NekoBox TV, OU=Personal, O=Personal, L=Personal, ST=Personal, C=CN"
          fi
          cp .tv-keystore release.keystore
      - name: Backup signing keystore
        uses: actions/upload-artifact@v4
        with:
          name: tv-keystore
          path: .tv-keystore
          retention-days: 90
      - name: Gradle Build
        env:
          BUILD_PLUGIN: none
        run: |
          echo "sdk.dir=${ANDROID_HOME}" > local.properties
          echo "ndk.dir=${ANDROID_HOME}/ndk/25.0.8775105" >> local.properties
          ./run init action gradle
          ./gradlew app:assembleOssRelease
          APK=$(find app/build/outputs/apk -name '*arm64-v8a*.apk')
          APK=$(dirname $APK)
          echo "APK=$APK" >> $GITHUB_ENV
      - name: Collect APKs
        run: |
          mkdir -p armv7a-apk release-apk
          find app/build/outputs/apk -name '*armeabi-v7a*.apk' -exec cp {} armv7a-apk/ \;
          find app/build/outputs/apk -name '*.apk' -exec cp {} release-apk/ \;
          ls -l release-apk
      - uses: actions/upload-artifact@v4
        with:
          name: NekoBox-TV-APK-armv7a
          path: armv7a-apk
          retention-days: 90
      - uses: actions/upload-artifact@v4
        with:
          name: NekoBox-TV-APK
          path: ${{ env.APK }}
      - name: Publish APKs to GitHub Release
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -e
          NOTES="Auto build from commit ${GITHUB_SHA::7} ($(date -u '+%Y-%m-%d %H:%M UTC')).
          Signed with the personal TV keystore, not an official release."
          if gh release view "$RELEASE_TAG" > /dev/null 2>&1; then
            gh release upload "$RELEASE_TAG" release-apk/*.apk --clobber
            gh release edit "$RELEASE_TAG" --title "NekoBox TV APK (auto build)" --notes "$NOTES"
          else
            gh release create "$RELEASE_TAG" release-apk/*.apk \
              --title "NekoBox TV APK (auto build)" --notes "$NOTES" --target "$GITHUB_SHA"
          fi
